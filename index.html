<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>立替＆傾斜つき割り勘計算 / Split Bill Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 450px; margin: 20px auto; padding: 15px; color: #333; background-color: #f8f9fa; }
    
    /* 言語切替スイッチ */
    .lang-switch { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .lang-btn { background: #e0e0e0; border: none; padding: 6px 12px; font-size: 0.85em; font-weight: bold; cursor: pointer; border-radius: 6px; margin-left: 5px; }
    .lang-btn.active { background: #007aff; color: white; }

    h2 { text-align: center; font-size: 1.3em; margin-bottom: 20px; color: #111; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .card-title { font-weight: bold; font-size: 1.05em; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #007aff; color: #007aff; }
    
    .input-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85em; font-weight: bold; color: #444; }
    .sub-label { font-size: 0.75em; color: #777; font-weight: normal; margin-left: 4px; }
    input { width: 100%; padding: 10px; font-size: 0.95em; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    input:focus { border-color: #007aff; }

    /* 立替項目の動的リスト */
    .item-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .item-name { flex: 1.2; }
    .item-price { flex: 1; }
    .item-payer { flex: 1; }
    .btn-del { background: #ff3b30; color: white; border: none; border-radius: 6px; width: 32px; height: 38px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    .btn-add { width: 100%; padding: 8px; background: #e5f1ff; color: #007aff; border: 1px dashed #007aff; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px; }

    .btn-calc { width: 100%; padding: 14px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-size: 1.05em; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-calc:active { background-color: #0056b3; }
    
    .result { margin-top: 20px; padding: 16px; background: #fff; border-radius: 12px; border: 1px solid #e0e0e0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .result-item { padding: 10px 0; border-bottom: 1px solid #eee; }
    .result-item:last-child { border-bottom: none; }
    .person-name { font-weight: bold; font-size: 1.05em; }
    .person-detail { font-size: 0.85em; color: #666; margin-top: 2px; }
    .pay-amount { font-size: 1.1em; font-weight: bold; text-align: right; }
    .pay-plus { color: #d9534f; } /* 支払う（赤） */
    .pay-minus { color: #28a745; } /* もらう（緑） */

    .total-summary { font-size: 0.9em; background: #f2f2f7; padding: 10px; border-radius: 8px; margin-bottom: 15px; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn-line { flex: 1; padding: 12px; background-color: #06C755; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.9em; display: flex; align-items: center; justify-content: center; }
    .btn-copy { flex: 1; padding: 12px; background-color: #6c757d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9em; }
  </style>
</head>
<body>

  <!-- 言語切替ボタン -->
  <div class="lang-switch">
    <button class="lang-btn active" id="btn-ja" onclick="setLanguage('ja')">日本語</button>
    <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
  </div>

  <h2 data-i18n="title">マルチ立替＆割り勘計算</h2>

  <!-- 1. 支払項目の入力 -->
  <div class="card">
    <div class="card-title" data-i18n="step1Title">1. 支払った項目（立替）</div>
    <div id="itemList">
      <!-- 初期表示の項目 -->
      <div class="item-row">
        <input type="text" class="item-name" placeholder="項目 (例: ホテル)" data-i18n-ph="phItem" value="ホテル">
        <input type="number" class="item-price" inputmode="numeric" placeholder="金額" data-i18n-ph="phPrice" value="15000">
        <input type="text" class="item-payer" placeholder="払った人" data-i18n-ph="phPayer" value="田中">
        <button class="btn-del" onclick="removeItem(this)">×</button>
      </div>
      <div class="item-row">
        <input type="text" class="item-name" placeholder="項目 (例: お昼)" data-i18n-ph="phItem" value="お昼">
        <input type="number" class="item-price" inputmode="numeric" placeholder="金額" data-i18n-ph="phPrice" value="4000">
        <input type="text" class="item-payer" placeholder="払った人" data-i18n-ph="phPayer" value="たく">
        <button class="btn-del" onclick="removeItem(this)">×</button>
      </div>
      <div class="item-row">
        <input type="text" class="item-name" placeholder="項目 (例: 夕食)" data-i18n-ph="phItem" value="夕食">
        <input type="number" class="item-price" inputmode="numeric" placeholder="金額" data-i18n-ph="phPrice" value="12000">
        <input type="text" class="item-payer" placeholder="払った人" data-i18n-ph="phPayer" value="なつ">
        <button class="btn-del" onclick="removeItem(this)">×</button>
      </div>
    </div>
    <button class="btn-add" id="btnAdd" onclick="addItem()" data-i18n="btnAdd">＋ 支払項目を追加</button>
  </div>

  <!-- 2. メンバーと条件設定 -->
  <div class="card">
    <div class="card-title" data-i18n="step2Title">2. メンバーと条件設定</div>
    
    <div class="input-group">
      <label for="drinkers"><span data-i18n="labelDrinkers">🍺 お酒を飲む人の名前</span><span class="sub-label" data-i18n="subSpace">（スペース区切り）</span></label>
      <input type="text" id="drinkers" placeholder="例: 田中 なつ" data-i18n-ph="phDrinkers" value="田中 なつ">
    </div>

    <div class="input-group">
      <label for="nonDrinkers"><span data-i18n="labelNonDrinkers">🍵 飲まない人の名前</span><span class="sub-label" data-i18n="subSpace">（スペース区切り）</span></label>
      <input type="text" id="nonDrinkers" placeholder="例: たく" data-i18n-ph="phNonDrinkers" value="たく">
    </div>

    <div class="input-group">
      <label for="extra" data-i18n="labelExtra">飲んだ人が多めに支払う額 (1人あたり/円)</label>
      <input type="number" id="extra" inputmode="numeric" placeholder="例: 1000" data-i18n-ph="phExtra" value="1000">
    </div>

    <button class="btn-calc" onclick="calculate()" data-i18n="btnCalc">精算額を計算する</button>
  </div>

  <!-- 3. 計算結果 -->
  <div class="result" id="result" style="display:none;"></div>

  <script>
    let currentLang = 'ja';
    let shareText = "";

    // 多言語辞書
    const i18n = {
      ja: {
        title: "マルチ立替＆割り勘計算",
        step1Title: "1. 支払った項目（立替）",
        step2Title: "2. メンバーと条件設定",
        labelDrinkers: "🍺 お酒を飲む人の名前",
        labelNonDrinkers: "🍵 飲まない人の名前",
        subSpace: "（スペース区切り）",
        labelExtra: "飲んだ人が多めに支払う額 (1人あたり/円)",
        btnAdd: "＋ 支払項目を追加",
        btnCalc: "精算額を計算する",
        phItem: "項目 (例: ホテル)",
        phPrice: "金額",
        phPayer: "払った人",
        phDrinkers: "例: 田中 なつ",
        phNonDrinkers: "例: たく",
        phExtra: "例: 1000",
        alertMinItem: "最低1つの項目が必要です。",
        alertNoPeople: "飲む人・飲まない人の名前を入力してください。",
        alertNoAmount: "立替の金額を入力してください。",
        san: "さん",
        payText: "支払う額",
        receiveText: "受け取る額",
        settledText: "精算なし (0円)",
        sharePay: "支払う",
        shareReceive: "もらう",
        shareSettled: "ちょうど精算済み",
        shareTitle: "【旅行・イベント精算のお願い】",
        shareTotal: "合計",
        shareBreakdown: "■ 支払内訳",
        shareResult: "■ 最終精算額",
        shareNote: "※🍺飲む人は+ {extra}円の傾斜計算済み",
        shareThanks: "よろしくお願いします！",
        btnLine: "💬 LINEで送る",
        btnCopy: "📋 コピー",
        copySuccess: "精算結果をコピーしました！",
        copyFail: "コピーに失敗しました",
        defaultItem: "項目",
        defaultPayer: "未設定",
        totalSummary: "全体の合計",
        drinkerBase: "飲む人",
        nonDrinkerBase: "飲まない人",
        baseLabel: "基準",
        costLabel: "負担",
        paidLabel: "立替"
      },
      en: {
        title: "Split Bill Calculator",
        step1Title: "1. Paid Items (Expenses)",
        step2Title: "2. Members & Rules",
        labelDrinkers: "🍺 Alcohol Drinkers",
        labelNonDrinkers: "🍵 Non-Drinkers",
        subSpace: "(Separated by space)",
        labelExtra: "Extra amount per drinker",
        btnAdd: "+ Add Item",
        btnCalc: "Calculate Settlement",
        phItem: "Item (e.g. Hotel)",
        phPrice: "Amount",
        phPayer: "Paid by",
        phDrinkers: "e.g. Alice Bob",
        phNonDrinkers: "e.g. Charlie",
        phExtra: "e.g. 1000",
        alertMinItem: "At least one item is required.",
        alertNoPeople: "Please enter member names.",
        alertNoAmount: "Please enter total expense amount.",
        san: "",
        payText: "To Pay",
        receiveText: "To Receive",
        settledText: "Settled (0)",
        sharePay: "Pays",
        shareReceive: "Gets back",
        shareSettled: "Settled",
        shareTitle: "[Settlement Request]",
        shareTotal: "Total",
        shareBreakdown: "■ Breakdown",
        shareResult: "■ Final Settlement",
        shareNote: "*🍺 Drinkers pay +{extra} extra",
        shareThanks: "Thank you!",
        btnLine: "💬 Share via LINE",
        btnCopy: "📋 Copy Result",
        copySuccess: "Copied to clipboard!",
        copyFail: "Failed to copy.",
        defaultItem: "Item",
        defaultPayer: "Unknown",
        totalSummary: "Total Amount",
        drinkerBase: "Drinkers",
        nonDrinkerBase: "Non-Drinkers",
        baseLabel: "base",
        costLabel: "Cost",
        paidLabel: "Paid"
      }
    };

    // 言語切り替え処理
    function setLanguage(lang) {
      currentLang = lang;
      
      // ボタンの見た目切替
      document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      // テキストの置換
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });

      // プレースホルダーの置換
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (i18n[lang][key]) el.placeholder = i18n[lang][key];
      });

      // すでに計算結果が出ている場合は再計算して言語反映
      if (document.getElementById('result').style.display !== 'none') {
        calculate();
      }
    }

    // 項目行を追加する関数
    function addItem() {
      const itemList = document.getElementById('itemList');
      const div = document.createElement('div');
      div.className = 'item-row';
      
      const t = i18n[currentLang];
      div.innerHTML = `
        <input type="text" class="item-name" placeholder="${t.phItem}" data-i18n-ph="phItem">
        <input type="number" class="item-price" inputmode="numeric" placeholder="${t.phPrice}" data-i18n-ph="phPrice">
        <input type="text" class="item-payer" placeholder="${t.phPayer}" data-i18n-ph="phPayer">
        <button class="btn-del" onclick="removeItem(this)">×</button>
      `;
      itemList.appendChild(div);
    }

    // 項目行を削除する関数
    function removeItem(btn) {
      const rows = document.querySelectorAll('.item-row');
      if (rows.length > 1) {
        btn.parentElement.remove();
      } else {
        alert(i18n[currentLang].alertMinItem);
      }
    }

    // 名前の分解関数
    function parseNames(inputStr) {
      if (!inputStr) return [];
      return inputStr.split(/[\s,、　]+/).filter(name => name.trim() !== "");
    }

    // メイン計算処理
    function calculate() {
      const t = i18n[currentLang];
      const drinkers = parseNames(document.getElementById('drinkers').value);
      const nonDrinkers = parseNames(document.getElementById('nonDrinkers').value);
      const extra = parseFloat(document.getElementById('extra').value) || 0;
      const resultDiv = document.getElementById('result');

      const drinkerCount = drinkers.length;
      const nonDrinkerCount = nonDrinkers.length;
      const totalPeople = drinkerCount + nonDrinkerCount;

      if (totalPeople === 0) {
        alert(t.alertNoPeople);
        return;
      }

      // 項目データの取得と合計・個人立替額の集計
      let totalAmount = 0;
      const paidByPerson = {};
      const itemSummaries = [];

      const rows = document.querySelectorAll('.item-row');
      rows.forEach(row => {
        const name = row.querySelector('.item-name').value.trim() || t.defaultItem;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const payer = row.querySelector('.item-payer').value.trim() || t.defaultPayer;

        if (price > 0) {
          totalAmount += price;
          paidByPerson[payer] = (paidByPerson[payer] || 0) + price;
          itemSummaries.push(`・${name}: ${price.toLocaleString()} (${payer})`);
        }
      });

      if (totalAmount === 0) {
        alert(t.alertNoAmount);
        return;
      }

      // 各自の負担額計算
      const basePay = (totalAmount - (drinkerCount * extra)) / totalPeople;
      let nonDrinkerPay = Math.round(basePay);
      let drinkerPay = nonDrinkerPay + extra;

      // 端数調整
      const calculatedTotal = (drinkerPay * drinkerCount) + (nonDrinkerPay * nonDrinkerCount);
      const diffAdjust = totalAmount - calculatedTotal;
      
      const allMembers = [];
      drinkers.forEach(name => allMembers.push({ name, isDrinker: true, targetPay: drinkerPay }));
      nonDrinkers.forEach(name => allMembers.push({ name, isDrinker: false, targetPay: nonDrinkerPay }));

      if (diffAdjust !== 0 && allMembers.length > 0) {
        allMembers[0].targetPay += diffAdjust;
      }

      // 精算結果テキスト作成
      let memberResultsHTML = "";
      let shareTextMembers = "";

      allMembers.forEach(m => {
        const paid = paidByPerson[m.name] || 0;
        const diff = m.targetPay - paid;
        const nameDisplay = m.name + (t.san ? t.san : "");

        let diffText = "";
        let cssClass = "";
        if (diff > 0) {
          diffText = `${t.payText}: ${diff.toLocaleString()}`;
          cssClass = "pay-plus";
          shareTextMembers += `・${nameDisplay} (${m.isDrinker ? '🍺' : '🍵'}): 【${diff.toLocaleString()} ${t.sharePay}】 (${t.costLabel}: ${m.targetPay.toLocaleString()} / ${t.paidLabel}: ${paid.toLocaleString()})\n`;
        } else if (diff < 0) {
          const refund = Math.abs(diff);
          diffText = `${t.receiveText}: ${refund.toLocaleString()}`;
          cssClass = "pay-minus";
          shareTextMembers += `・${nameDisplay} (${m.isDrinker ? '🍺' : '🍵'}): 【${refund.toLocaleString()} ${t.shareReceive}】 (${t.costLabel}: ${m.targetPay.toLocaleString()} / ${t.paidLabel}: ${paid.toLocaleString()})\n`;
        } else {
          diffText = `${t.settledText}`;
          shareTextMembers += `・${nameDisplay} (${m.isDrinker ? '🍺' : '🍵'}): ${t.shareSettled}\n`;
        }

        memberResultsHTML += `
          <div class="result-item">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="person-name">${m.isDrinker ? '🍺' : '🍵'} ${nameDisplay}</span>
              <span class="pay-amount ${cssClass}">${diffText}</span>
            </div>
            <div class="person-detail">
              ${t.costLabel}: ${m.targetPay.toLocaleString()} / ${t.paidLabel}: ${paid.toLocaleString()}
            </div>
          </div>
        `;
      });

      // LINE共有テキスト構築
      const noteText = t.shareNote.replace('{extra}', extra.toLocaleString());
      shareText = `${t.shareTitle}\n`
                + `${t.shareTotal}: ${totalAmount.toLocaleString()}\n\n`
                + `${t.shareBreakdown}\n${itemSummaries.join('\n')}\n\n`
                + `${t.shareResult}\n${shareTextMembers}\n`
                + `${noteText}\n`
                + `${t.shareThanks}`;

      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`;

      // 画面出力
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <div class="total-summary">
          <strong>${t.totalSummary}: ${totalAmount.toLocaleString()}</strong><br>
          <span style="font-size:0.85em; color:#555;">(${t.drinkerBase}: ${drinkerPay.toLocaleString()} / ${t.nonDrinkerBase}: ${nonDrinkerPay.toLocaleString()} ${t.baseLabel})</span>
        </div>

        ${memberResultsHTML}

        <div class="btn-group">
          <a class="btn-line" href="${lineUrl}" target="_blank">${t.btnLine}</a>
          <button class="btn-copy" onclick="copyText()">${t.btnCopy}</button>
        </div>
      `;
    }

    function copyText() {
      if (!shareText) return;
      const t = i18n[currentLang];
      navigator.clipboard.writeText(shareText).then(() => {
        alert(t.copySuccess);
      }).catch(() => {
        alert(t.copyFail);
      });
    }
  </script>

</body>
</html>
