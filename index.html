<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARIKAN</title>
  
  <!-- タブに表示されるアイコン（ファビコン） -->
  <link rel="icon" href="/apple-touch-icon.png">

  <!-- スマホのホーム画面に追加した時のアイコン -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- ホーム画面追加用（PWA・アイコン設定） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WARIKAN">
  <link rel="apple-touch-icon" href="https://dummyimage.com/180x180/007aff/ffffff.png&text=WARIKAN">

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 450px; margin: 20px auto; padding: 15px; color: #333; background-color: #f8f9fa; }
    
    /* 上部バー（リセットボタン ＆ 言語切替） */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-reset { background: #e0e0e0; border: none; padding: 6px 10px; font-size: 1.1em; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
    .btn-reset:active { background: #d0d0d0; }

    /* 言語切替スイッチ（アイコン風） */
    .lang-switch { display: flex; }
    .lang-btn { background: #e0e0e0; border: none; padding: 6px 10px; font-size: 1.1em; cursor: pointer; border-radius: 6px; margin-left: 5px; display: flex; align-items: center; justify-content: center; }
    .lang-btn.active { background: #007aff; color: white; }

    .header-area { text-align: center; margin-bottom: 20px; }
    h2 { font-size: 1.6em; margin: 0 0 4px 0; color: #111; font-weight: 800; letter-spacing: 0.5px; }
    .subtitle { font-size: 0.85em; color: #666; margin: 0; }

    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .card-title { font-weight: bold; font-size: 1.05em; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #007aff; color: #007aff; }
    
    .input-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85em; font-weight: bold; color: #444; }
    .sub-label { font-size: 0.75em; color: #777; font-weight: normal; margin-left: 4px; }
    input, select { width: 100%; padding: 10px; font-size: 0.95em; border: 1px solid #ccc; border-radius: 6px; outline: none; background-color: #fff; }
    input:focus, select:focus { border-color: #007aff; }

    /* 立替項目の動的リスト */
    .item-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .item-name { flex: 1.2; }
    .item-price { flex: 1; }
    .item-payer { flex: 1; }
    /* タップ領域を広げた削除ボタン */
    .btn-del { background: #ff3b30; color: white; border: none; border-radius: 6px; width: 40px; height: 40px; font-weight: bold; cursor: pointer; flex-shrink: 0; font-size: 1.2em; display: flex; align-items: center; justify-content: center; }
    .btn-add { width: 100%; padding: 10px; background: #e5f1ff; color: #007aff; border: 1px dashed #007aff; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px; }

    /* 多めに払う人と追加額を横並びにするレイアウト */
    .extra-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .extra-names { flex: 1.8; }
    .extra-amount { flex: 1; }

    /* 独立したメインボタン（WARIKAN）: 上のマージンを詰めました */
    .btn-calc { width: 100%; padding: 16px; background-color: #007aff; color: white; border: none; border-radius: 12px; font-size: 1.2em; font-weight: 800; letter-spacing: 1px; cursor: pointer; margin: 10px 0 10px 0; box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3); transition: transform 0.1s; }
    .btn-calc:active { transform: scale(0.98); background-color: #0056b3; }
    
    .result { margin-top: 20px; padding: 16px; background: #fff; border-radius: 12px; border: 1px solid #e0e0e0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .result-item { padding: 10px 0; border-bottom: 1px solid #eee; }
    .result-item:last-child { border-bottom: none; }
    .person-name { font-weight: bold; font-size: 1.05em; }
    .person-detail { font-size: 0.85em; color: #666; margin-top: 2px; }
    .pay-amount { font-size: 1.1em; font-weight: bold; text-align: right; }
    .pay-plus { color: #d9534f; }
    .pay-minus { color: #28a745; }

    .total-summary { font-size: 0.9em; background: #f2f2f7; padding: 10px; border-radius: 8px; margin-bottom: 15px; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn-line { flex: 1; padding: 12px; background-color: #06C755; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.9em; display: flex; align-items: center; justify-content: center; }
    .btn-copy { flex: 1; padding: 12px; background-color: #6c757d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9em; }
  </style>
</head>
<body>

  <!-- 上部バー（リセットボタン ＆ アイコン型言語切替） -->
  <div class="top-bar">
    <button class="btn-reset" onclick="resetForm()" title="Reset">🔄</button>
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-ja" onclick="setLanguage('ja')" title="日本語">🇯🇵</button>
      <button class="lang-btn" id="btn-en" onclick="setLanguage('en')" title="English">🌐</button>
    </div>
  </div>

  <div class="header-area">
    <h2>WARIKAN</h2>
    <p class="subtitle">A simple way to split bills fairly.</p>
  </div>

  <!-- 1. メンバー -->
  <div class="card">
    <div class="card-title" data-i18n="step1Title">1. メンバー</div>
    <div class="input-group" style="margin-bottom:0;">
      <label><span data-i18n="labelMembers">全員の名前</span><span class="sub-label" data-i18n="subSpace">（スペース区切り）</span></label>
      <input type="text" id="allMembers" placeholder="名前" data-i18n-ph="phMembers" value="">
    </div>
  </div>

  <!-- 2. 支払い -->
  <div class="card">
    <div class="card-title" data-i18n="step2Title">2. 支払い</div>
    <div id="itemList">
      <div class="item-row">
        <input type="text" class="item-name" placeholder="項目" data-i18n-ph="phItem" value="">
        <input type="number" pattern="[0-9]*" class="item-price" inputmode="numeric" placeholder="金額" data-i18n-ph="phPrice" value="">
        <input type="text" class="item-payer" placeholder="払った人" data-i18n-ph="phPayer" value="">
        <button class="btn-del" onclick="removeItem(this)">×</button>
      </div>
    </div>
    <button class="btn-add" id="btnAddItem" onclick="addItem()" data-i18n="btnAddItem">＋ 支払項目を追加</button>
  </div>

  <!-- 3. 調整 -->
  <div class="card">
    <div class="card-title" data-i18n="step3Title">3. 調整</div>
    
    <div class="input-group" style="margin-bottom:0;">
      <label><span data-i18n="labelExtraPayers">多めに払う人と追加額</span><span class="sub-label" data-i18n="subSpaceOptional">（任意）</span></label>
      <div id="extraList">
        <div class="extra-row">
          <input type="text" class="extra-names" placeholder="多めに払う人の名前" data-i18n-ph="phExtraPayers" value="">
          <input type="number" pattern="[0-9]*" class="extra-amount" inputmode="numeric" placeholder="+追加額" data-i18n-ph="phExtra" value="">
          <button class="btn-del" onclick="removeExtra(this)">×</button>
        </div>
      </div>
      <button class="btn-add" id="btnAddExtra" onclick="addExtra()" data-i18n="btnAddExtra">＋ 追加</button>
    </div>
  </div>

  <!-- 独立した計算ボタン -->
  <button class="btn-calc" onclick="calculate()">WARIKAN</button>

  <!-- 計算結果 -->
  <div class="result" id="result" style="display:none;"></div>

  <script>
    let currentLang = 'ja';
    let shareText = "";

    const i18n = {
      ja: {
        step1Title: "1. メンバー",
        step2Title: "2. 支払い",
        step3Title: "3. 調整",
        labelMembers: "全員の名前",
        labelExtraPayers: "多めに払う人と追加額",
        subSpace: "（スペース区切り）",
        subSpaceOptional: "（任意）",
        btnAddItem: "＋ 支払項目を追加",
        btnAddExtra: "＋ 追加",
        phMembers: "名前",
        phItem: "項目",
        phPrice: "金額",
        phPayer: "払った人",
        phExtraPayers: "多めに払う人の名前",
        phExtra: "+追加額",
        alertMinItem: "最低1つの項目が必要です。",
        alertNoMembers: "メンバー全員の名前を入力してください。",
        alertNoAmount: "立替の金額を入力してください。",
        confirmReset: "入力をすべてリセットしますか？",
        san: "さん",
        payText: "支払う額",
        receiveText: "受け取る額",
        settledText: "精算なし (0円)",
        sharePay: "支払う",
        shareReceive: "もらう",
        shareSettled: "ちょうど精算済み",
        shareTitle: "【旅行・イベント精算のお願い】",
        shareTotal: "合計",
        shareBreakdown: "■ 支払内訳",
        shareResult: "■ 最終精算額",
        shareNote: "※傾斜調整（多め負担）計算済み",
        shareThanks: "よろしくお願いします！",
        btnLine: "💬 LINEで送る",
        btnCopy: "📋 コピー",
        copySuccess: "精算結果をコピーしました！",
        copyFail: "コピーに失敗しました",
        defaultItem: "項目",
        defaultPayer: "未設定",
        totalSummary: "全体の合計",
        baseLabel: "基本額",
        costLabel: "負担",
        paidLabel: "立替"
      },
      en: {
        step1Title: "1. Members",
        step2Title: "2. Payments",
        step3Title: "3. Adjustments",
        labelMembers: "All Member Names",
        labelExtraPayers: "People who pay extra & Amount",
        subSpace: "(Separated by space)",
        subSpaceOptional: "(Optional)",
        btnAddItem: "+ Add Item",
        btnAddExtra: "+ Add Extra Rule",
        phMembers: "Names",
        phItem: "Item",
        phPrice: "Amount",
        phPayer: "Paid by",
        phExtraPayers: "Names paying extra",
        phExtra: "+Extra",
        alertMinItem: "At least one item is required.",
        alertNoMembers: "Please enter member names.",
        alertNoAmount: "Please enter total expense amount.",
        confirmReset: "Are you sure you want to reset all inputs?",
        san: "",
        payText: "To Pay",
        receiveText: "To Receive",
        settledText: "Settled (0)",
        sharePay: "Pays",
        shareReceive: "Gets back",
        shareSettled: "Settled",
        shareTitle: "[Settlement Request]",
        shareTotal: "Total",
        shareBreakdown: "■ Breakdown",
        shareResult: "■ Final Settlement",
        shareNote: "*Extra adjustments included",
        shareThanks: "Thank you!",
        btnLine: "💬 Share via LINE",
        btnCopy: "📋 Copy Result",
        copySuccess: "Copied to clipboard!",
        copyFail: "Failed to copy.",
        defaultItem: "Item",
        defaultPayer: "Unknown",
        totalSummary: "Total Amount",
        baseLabel: "Base",
        costLabel: "Cost",
        paidLabel: "Paid"
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });

      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (i18n[lang][key]) el.placeholder = i18n[lang][key];
      });

      if (document.getElementById('result').style.display !== 'none') {
        calculate();
      }
    }

    function addItem() {
      const itemList = document.getElementById('itemList');
      const div = document.createElement('div');
      div.className = 'item-row';
      const t = i18n[currentLang];
      div.innerHTML = `
        <input type="text" class="item-name" placeholder="${t.phItem}" data-i18n-ph="phItem">
        <input type="number" pattern="[0-9]*" class="item-price" inputmode="numeric" placeholder="${t.phPrice}" data-i18n-ph="phPrice">
        <input type="text" class="item-payer" placeholder="${t.phPayer}" data-i18n-ph="phPayer">
        <button class="btn-del" onclick="removeItem(this)">×</button>
      `;
      itemList.appendChild(div);
    }

    function removeItem(btn) {
      const rows = document.querySelectorAll('#itemList .item-row');
      if (rows.length > 1) {
        btn.parentElement.remove();
      } else {
        alert(i18n[currentLang].alertMinItem);
      }
    }

    function addExtra() {
      const extraList = document.getElementById('extraList');
      const div = document.createElement('div');
      div.className = 'extra-row';
      const t = i18n[currentLang];
      div.innerHTML = `
        <input type="text" class="extra-names" placeholder="${t.phExtraPayers}" data-i18n-ph="phExtraPayers">
        <input type="number" pattern="[0-9]*" class="extra-amount" inputmode="numeric" placeholder="${t.phExtra}" data-i18n-ph="phExtra">
        <button class="btn-del" onclick="removeExtra(this)">×</button>
      `;
      extraList.appendChild(div);
    }

    function removeExtra(btn) {
      const rows = document.querySelectorAll('#extraList .extra-row');
      if (rows.length > 1) {
        btn.parentElement.remove();
      } else {
        const row = rows[0];
        row.querySelector('.extra-names').value = '';
        row.querySelector('.extra-amount').value = '';
      }
    }

    function resetForm() {
      const t = i18n[currentLang];
      if (!confirm(t.confirmReset)) return;

      document.getElementById('allMembers').value = '';

      const itemList = document.getElementById('itemList');
      itemList.innerHTML = `
        <div class="item-row">
          <input type="text" class="item-name" placeholder="${t.phItem}" data-i18n-ph="phItem" value="">
          <input type="number" pattern="[0-9]*" class="item-price" inputmode="numeric" placeholder="${t.phPrice}" data-i18n-ph="phPrice" value="">
          <input type="text" class="item-payer" placeholder="${t.phPayer}" data-i18n-ph="phPayer" value="">
          <button class="btn-del" onclick="removeItem(this)">×</button>
        </div>
      `;

      const extraList = document.getElementById('extraList');
      extraList.innerHTML = `
        <div class="extra-row">
          <input type="text" class="extra-names" placeholder="${t.phExtraPayers}" data-i18n-ph="phExtraPayers" value="">
          <input type="number" pattern="[0-9]*" class="extra-amount" inputmode="numeric" placeholder="${t.phExtra}" data-i18n-ph="phExtra" value="">
          <button class="btn-del" onclick="removeExtra(this)">×</button>
        </div>
      `;

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'none';
      resultDiv.innerHTML = '';
      shareText = '';
    }

    function parseNames(inputStr) {
      if (!inputStr) return [];
      return inputStr.split(/[\s,、 ]+/).filter(name => name.trim() !== "");
    }

    function calculate() {
      const t = i18n[currentLang];
      const memberNames = parseNames(document.getElementById('allMembers').value);
      const resultDiv = document.getElementById('result');

      const totalPeople = memberNames.length;

      if (totalPeople === 0) {
        alert(t.alertNoMembers);
        return;
      }

      const extraPayMap = {};
      let totalExtraAdded = 0;

      const extraRows = document.querySelectorAll('.extra-row');
      extraRows.forEach(row => {
        const names = parseNames(row.querySelector('.extra-names').value);
        const amount = parseFloat(row.querySelector('.extra-amount').value) || 0;
        
        if (amount > 0 && names.length > 0) {
          names.forEach(name => {
            extraPayMap[name] = (extraPayMap[name] || 0) + amount;
            totalExtraAdded += amount;
          });
        }
      });

      let totalAmount = 0;
      const paidByPerson = {};
      const itemSummaries = [];

      const rows = document.querySelectorAll('#itemList .item-row');
      rows.forEach(row => {
        const name = row.querySelector('.item-name').value.trim() || t.defaultItem;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const payer = row.querySelector('.item-payer').value.trim();

        if (price > 0) {
          totalAmount += price;
          if (payer) {
            paidByPerson[payer] = (paidByPerson[payer] || 0) + price;
          }
          itemSummaries.push(`・${name}: ${price.toLocaleString()}円 (${payer || t.defaultPayer})`);
        }
      });

      if (totalAmount === 0) {
        alert(t.alertNoAmount);
        return;
      }

      const basePay = (totalAmount - totalExtraAdded) / totalPeople;
      let roundedBasePay = Math.round(basePay);

      const allMembers = memberNames.map(name => {
        const extraAdd = extraPayMap[name] || 0;
        return {
          name,
          isExtra: extraAdd > 0,
          targetPay: roundedBasePay + extraAdd
        };
      });

      const calculatedTotal = allMembers.reduce((sum, m) => sum + m.targetPay, 0);
      const diffAdjust = totalAmount - calculatedTotal;

      if (diffAdjust !== 0 && allMembers.length > 0) {
        allMembers[0].targetPay += diffAdjust;
      }

      let memberResultsHTML = "";
      let shareTextMembers = "";

      allMembers.forEach(m => {
        const paid = paidByPerson[m.name] || 0;
        const diff = m.targetPay - paid;
        const nameDisplay = m.name + (t.san ? t.san : "");
        const icon = '👤';

        let diffText = "";
        let cssClass = "";
        if (diff > 0) {
          diffText = `${t.payText}: ${diff.toLocaleString()} 円`;
          cssClass = "pay-plus";
          shareTextMembers += `・${nameDisplay} (${icon}): 【${diff.toLocaleString()}円 ${t.sharePay}】 (${t.costLabel}: ${m.targetPay.toLocaleString()}円 / ${t.paidLabel}: ${paid.toLocaleString()}円)\n`;
        } else if (diff < 0) {
          const refund = Math.abs(diff);
          diffText = `${t.receiveText}: ${refund.toLocaleString()} 円`;
          cssClass = "pay-minus";
          shareTextMembers += `・${nameDisplay} (${icon}): 【${refund.toLocaleString()}円 ${t.shareReceive}】 (${t.costLabel}: ${m.targetPay.toLocaleString()}円 / ${t.paidLabel}: ${paid.toLocaleString()}円)\n`;
        } else {
          diffText = `${t.settledText}`;
          shareTextMembers += `・${nameDisplay} (${icon}): ${t.shareSettled}\n`;
        }

        memberResultsHTML += `
          <div class="result-item">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="person-name">${icon} ${nameDisplay}</span>
              <span class="pay-amount ${cssClass}">${diffText}</span>
            </div>
            <div class="person-detail">
              ${t.costLabel}: ${m.targetPay.toLocaleString()}円 / ${t.paidLabel}: ${paid.toLocaleString()}円
            </div>
          </div>
        `;
      });

      const noteText = totalExtraAdded > 0 ? `\n${t.shareNote}` : '';
      shareText = `${t.shareTitle}\n`
                + `${t.shareTotal}: ${totalAmount.toLocaleString()}円\n\n`
                + `${t.shareBreakdown}\n${itemSummaries.join('\n')}\n\n`
                + `${t.shareResult}\n${shareTextMembers}`
                + `${noteText}\n`
                + `${t.shareThanks}`;

      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`;

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <div class="total-summary">
          <strong>${t.totalSummary}: ${totalAmount.toLocaleString()} 円</strong><br>
          <span style="font-size:0.85em; color:#555;">(${t.baseLabel}: ${roundedBasePay.toLocaleString()}円)</span>
        </div>

        ${memberResultsHTML}

        <div class="btn-group">
          <a class="btn-line" href="${lineUrl}" target="_blank">${t.btnLine}</a>
          <button class="btn-copy" onclick="copyText()">${t.btnCopy}</button>
        </div>
      `;
    }

    function copyText() {
      if (!shareText) return;
      const t = i18n[currentLang];
      navigator.clipboard.writeText(shareText).then(() => {
        alert(t.copySuccess);
      }).catch(() => {
        alert(t.copyFail);
      });
    }
  </script>

</body>
</html>
